name: Compilar APK Mapeo FES

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app-celular/package-lock.json

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Licencias y paquetes del SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" || true

      - name: Instalar dependencias
        working-directory: app-celular
        run: npm ci

      - name: Generar proyecto nativo
        working-directory: app-celular
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK
        working-directory: app-celular/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app-celular/android/app/build/outputs/apk/release/*.apk