            html: `<div style="background:${color};width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);"></div>`,
            className: '', iconSize: [22, 22], iconAnchor: [11, 11]
        });
        const marker = L.marker([p.lat, p.lng], { icon });
        const nombre = p.nombre || p.tipo;
        marker.bindPopup(`<div style="font-size:14px;font-weight:600;color:#1F4E79">${nombre}</div><div style="font-size:11px;color:#666;margin-top:4px">Lat: ${p.lat.toFixed(6)}<br>Lng: ${p.lng.toFixed(6)}</div>`);
        markers.addLayer(marker);
    });
    map.addLayer(markers);

const leyenda = L.control({ position: 'topright' });
leyenda.onAdd = function() {
    const div = L.DomUtil.create('div', 'leyenda');
    div.innerHTML = '<h4>Tipo de punto</h4><div><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:#78909c;margin-right:6px;vertical-align:middle;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)"></span><span style="vertical-align:middle">Otro</span></div><div><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:#14b8a6;margin-right:6px;vertical-align:middle;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)"></span><span style="vertical-align:middle">Rampa</span></div><div><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:#f97316;margin-right:6px;vertical-align:middle;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)"></span><span style="vertical-align:middle">Punto de reunion</span></div><div><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:#84cc16;margin-right:6px;vertical-align:middle;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)"></span><span style="vertical-align:middle">Lugar de descanso</span></div><div><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:#d946ef;margin-right:6px;vertical-align:middle;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)"></span><span style="vertical-align:middle">Escalon</span></div><div><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:#29b6f6;margin-right:6px;vertical-align:middle;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)"></span><span style="vertical-align:middle">Bano</span></div><div><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:#0ea5e9;margin-right:6px;vertical-align:middle;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)"></span><span style="vertical-align:middle">Escaleras</span></div><div><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:#6366f1;margin-right:6px;vertical-align:middle;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)"></span><span style="vertical-align:middle">Entrada/Salida</span></div>';
    return div;
};
leyenda.addTo(map);

const info = L.control({ position: 'bottomleft' });
info.onAdd = function() {
    const div = L.DomUtil.create('div', 'info');
    div.innerHTML = '<h4>Sesion: 02/09/2026</h4>Puntos: 77<br>Track: 447<br>Recorrido: 11:07 AM - 11:52 AM';
    return div;
};
info.addTo(map);

if (puntos.length > 0) {
    const bounds = L.latLngBounds(puntos.map(p => [p.lat, p.lng]));
    const zoomActual = map.getBoundsZoom(bounds, false);
    map.fitBounds(bounds, { padding: [60, 60], maxZoom: 17 });
}
</script>
