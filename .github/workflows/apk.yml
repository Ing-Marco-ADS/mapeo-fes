name: Compilar APK Mapeo FES

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app-celular/package-lock.json

      - name: Verificar Android SDK (ya viene preinstalado)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Instalar dependencias
        working-directory: app-celular
        run: npm ci

      - name: Generar proyecto nativo
        working-directory: app-celular
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK
        working-directory: app-celular/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app-celular/android/app/build/outputs/apk/release/*.apk