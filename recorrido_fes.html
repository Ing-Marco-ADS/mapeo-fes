const colores = {'banio':'#29b6f6','biblioteca':'#ab47bc','edificio':'#66bb6a','acceso':'#ffa726','alarma':'#ef5350','otro':'#78909c'};

const mapa = L.map('mapa');
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 22,
  maxNativeZoom: 19,
  minZoom: 15,
  attribution:'&copy; OpenStreetMap'
}).addTo(mapa);

// Linea del recorrido
const latlngs = tracks.map(t => [t.lat, t.lng]);
L.polyline(latlngs, {color:'#2196F3', weight:5, opacity:0.9}).addTo(mapa);

// Punto inicial
L.circleMarker(latlngs[0], {radius:7, color:'#fff', fillColor:'#4caf50', fillOpacity:1, weight:3}).addTo(mapa)
  .bindPopup('<b>Inicio del recorrido</b>');
// Punto final
L.circleMarker(latlngs[latlngs.length-1], {radius:7, color:'#fff', fillColor:'#f44336', fillOpacity:1, weight:3}).addTo(mapa)
  .bindPopup('<b>Fin del recorrido</b>');

// Puntos marcados
puntos.forEach(p => {
  const html = `<div style="width:26px;height:26px;background:${colores[p.tipo]};border:3px solid white;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,0.5)"></div>`;
  const icon = L.divIcon({className:'', html, iconSize:[26,26], iconAnchor:[13,13]});
  L.marker([p.lat, p.lng], {icon}).addTo(mapa).bindPopup(
    `<b>${p.descripcion}</b><br>Lat: ${p.lat.toFixed(6)}<br>Lng: ${p.lng.toFixed(6)}`
  );
});

// Ajustar la vista a todo el recorrido
mapa.fitBounds(latlngs, {padding:[50,50]});
